name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # `fix/**` and `feat/**` so a PR stacked on another feature branch still
    # gets CI. Without it a stacked PR reports no checks at all and is
    # unverifiable until it retargets to main, which is exactly when review is
    # least useful.
    branches: [main, "fix/**", "feat/**"]

# Read-only by default. `packages: write` is granted to the `docker` job alone:
# at workflow scope it also applied to `check`, `contract` and `e2e`, so every
# pull_request build ran with a token that could push to the registry --
# including the `contract` job, which pipes a remote installer into bash.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the contract artifact, which is no longer committed to git.
  # aztec-nargo, not plain nargo: public functions must be transpiled to AVM
  # bytecode or loadContractArtifact() rejects the result at runtime with
  # "Contract's public bytecode has not been transpiled". That is exactly how
  # the previously committed artifact was broken.
  contract:
    runs-on: ubuntu-latest
    # The one place the COMPILE toolchain version is written. It has to match
    # the aztec-nr dependency in contracts/spending_limit_account/Nargo.toml, and
    # it is asserted below rather than assumed.
    #
    # It is pinned separately from the runtime (the @aztec-labs/* SDK in
    # package.json and the sandbox image in docker-compose.yml), because the
    # class ID and so the account address derive from this build's bytecode.
    # Both are 6.0.0 for the testnet tracer (xochi-fi/pxe-bridge#55); the
    # contract was compiled by 5.1.0 before that, which is what NM-1019
    # audited. The class ID check below loads this artifact through the SDK,
    # so it also checks that the runtime derives the committed class ID from
    # it. This job's x86 build is the artifact of record: CLASS_ID holds what
    # it produces.
    env:
      AZTEC_COMPILE_VERSION: "6.0.0"
      # aztec-up otherwise replaces itself with the latest copy on its first
      # run (no .last_update_check), undoing the pin below.
      AZTEC_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      # Needed by the class ID check below, which loads the artifact through
      # @aztec-labs/stdlib rather than reading JSON fields. 24.15.0, not 22:
      # the 6.0.0 installer refuses an older Node ("Minimum Node.js version
      # 24.15.0 not found") before it installs anything.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      # Only aztec-up, fetched from the pinned release's directory, not the
      # root installer at https://install.aztec-labs.com. That one installs the
      # latest release before anything else (`aztec-up install latest`, 5.3.0
      # on 2026-10-30), and that release's per-version installer resolves its
      # npm tree with an unlocked `npm install`. On 2026-10-30 that 404'd on
      # tslib 2.9.1, published 27 s before the run (run 41122380004). The 6.0.0
      # per-version installer installs from the release's own lock
      # (`packages.tar.gz`, then `npm ci`), and the step below runs only that.
      - name: Install aztec-up
        run: |
          mkdir -p "$HOME/.aztec/bin"
          curl -fsSL "https://install.aztec-labs.com/$AZTEC_COMPILE_VERSION/aztec-up" \
            -o "$HOME/.aztec/bin/aztec-up"
          chmod +x "$HOME/.aztec/bin/aztec-up"
          echo "$HOME/.aztec/bin" >> "$GITHUB_PATH"
      - name: Pin toolchain and expose it on PATH
        run: |
          # The installer's exit code is not the question. `aztec-up` finishes
          # with install_native_symlinks, which fails the whole install if any
          # bundled binary is missing, and as of 2026-08-26 `forge` is missing
          # from the 5.1.0 bundle:
          #
          #   Error: expected bundled binary 'forge' missing from
          #          ~/.aztec/versions/5.1.0/internal-bin
          #
          # This job compiles a Noir contract. It never touches Foundry. The
          # same commit that passed on 19 Aug fails this way now, from a
          # version we pin, because `aztec-up install 5.1.0` pinned the
          # toolchain and not the per-version installer it fetches from
          # install.aztec-labs.com/<version>/install. That is the build supply
          # chain risk in SECURITY.md arriving in practice.
          #
          # So record the installer's verdict and then check for the two
          # binaries this job actually runs. Failing on a missing `forge` is a
          # red build over something we do not use; failing on a missing
          # `aztec` or `aztec-nargo` is real and still fails below.
          set +e
          aztec-up install "$AZTEC_COMPILE_VERSION"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::aztec-up exited $status; continuing only if the needed binaries are present"
          fi
          # Searched under the pinned version directory, not all of ~/.aztec.
          # The root installer this job used to run installed the latest
          # release before `aztec-up install` pinned ours, so ~/.aztec held
          # both. A search across the whole tree took whichever the walk
          # reached first, and on 2026-08-26 that was 5.2.0: `aztec --version`
          # reported 5.2.0 with nargo 1.0.0-beta.25, under which aztec-nr
          # 5.1.0's own test helpers do not compile. The job failed with 277
          # errors inside macros/oracle_testing.nr and none in this contract.
          root="$HOME/.aztec/versions/$AZTEC_COMPILE_VERSION"
          if [ ! -d "$root" ]; then
            echo "$AZTEC_COMPILE_VERSION is not installed (aztec-up exited $status); tree under ~/.aztec:"
            find "$HOME/.aztec" -maxdepth 3
            exit 1
          fi
          # aztec-up keeps versioned binaries outside ~/.aztec/bin and only
          # updates PATH for a login shell, which workflow steps do not get.
          bin=$(find "$root" \( -type f -o -type l \) -name aztec-nargo | head -1)
          if [ -z "$bin" ]; then
            echo "aztec-nargo not found under $root (aztec-up exited $status); tree:"
            find "$root" -maxdepth 3
            exit 1
          fi
          dir=$(dirname "$bin")
          if [ ! -x "$dir/aztec" ]; then
            echo "aztec not found beside aztec-nargo (aztec-up exited $status); contents of $dir:"
            ls -la "$dir"
            exit 1
          fi
          echo "$dir" >> "$GITHUB_PATH"
      # Asserted, not printed. Printing is what let 5.2.0 through: the version
      # was in the log the whole time and nothing read it. The contract class
      # ID derives from this toolchain's bytecode and feeds address derivation,
      # so a silent version change moves the account address. Fail here, where
      # the message names the cause, rather than in the class ID check, where
      # it looks like the contract changed.
      - name: Assert the pinned toolchain is the one on PATH
        run: |
          aztec-nargo --version
          found=$(aztec --version)
          if [ "$found" != "$AZTEC_COMPILE_VERSION" ]; then
            echo "::error::toolchain drifted: aztec --version reports $found, expected $AZTEC_COMPILE_VERSION"
            echo "PATH resolves aztec to: $(command -v aztec)"
            exit 1
          fi
          echo "aztec $found"
      - name: Contract unit tests (spending-limit guard)
        working-directory: contracts/spending_limit_account
        run: aztec-nargo test
      # `aztec compile`, not `aztec-nargo compile`. aztec-nargo is a symlink to
      # plain nargo and emits an artifact with transpiled=false, which
      # loadContractArtifact rejects with "public bytecode has not been
      # transpiled". `aztec compile` runs nargo then postprocesses to transpile
      # public functions to AVM bytecode and generate verification keys.
      #
      # HARDWARE_CONCURRENCY=1: `bb aztec_process` otherwise derives all private
      # function verification keys at once, one thread each, in one process.
      # bb 5.1.0 is not thread-safe there (cycle_group reads offset generators
      # from a process-global map that `get()` mutates unlocked), and it
      # intermittently emitted a wrong constructor VK, which moves the class ID
      # through the private functions root: runs 32048928421, 37231706545,
      # 37251698866. With one CPU it derives one key at a time.
      - name: Compile and transpile contract
        working-directory: contracts/spending_limit_account
        env:
          HARDWARE_CONCURRENCY: "1"
        run: aztec compile
      # Uploaded BEFORE the class ID check, deliberately. With the check first
      # a drifted artifact was discarded, leaving nothing to diff against a good
      # one.
      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifact
          path: contracts/spending_limit_account/target/*.json
          if-no-files-found: error
      # The artifact is gitignored and rebuilt here every run, from a toolchain
      # fetched by piping a remote installer into bash. The class ID derives
      # from that bytecode and feeds address derivation, so drift silently moves
      # the account address: the bridge finds no contract there, deploys a fresh
      # empty account, logs "Ready", and strands the balance at the old address.
      - name: Assert artifact is loadable and the class ID has not drifted
        run: node scripts/contract-class-id.js --check contracts/spending_limit_account/CLASS_ID
      # The class ID covers bytecode and VKs but not the whole file: ABI,
      # storage layout and metadata can change without moving it. The bridge
      # encodes against the ABI and reads storage slots from the layout, so the
      # artifact a deployment is made against is pinned byte for byte too, as a
      # sha256 with the absolute build paths in `file_map` cut to repo- and
      # nargo-cache-relative ones (scripts/artifact-digest.js says why). Runs
      # after the upload, like the class ID check, so a drifted file is kept,
      # and fails the job, which `e2e` and `docker` (publishing) both need.
      - name: Assert the artifact digest is the recorded one
        run: node scripts/artifact-digest.js --check contracts/spending_limit_account/ARTIFACT_SHA256
      # The entrypoint ABI in src/spending-limit-account.ts is written by hand,
      # and this is the only job with an artifact to hold it against. Drift
      # keeps the address and breaks the selector or the argument layout, so it
      # fails on chain rather than here unless something compares them. The
      # `check` job runs the same file without the artifact and skips this test.
      - name: Assert the hand-written entrypoint ABI matches the artifact
        run: npx vitest run tests/spending-limit-account.test.ts -t "entrypoint ABI matches the compiled artifact"

  e2e:
    needs: [check, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch contract artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-artifact
          path: contracts/spending_limit_account/target
      # Compose is started here rather than by test:e2e:up, which takes it down
      # on exit and with it the node log, the only record of why the node
      # rejected a send.
      - run: docker compose up -d --wait anvil aztec-sandbox
      # No PXE_BRIDGE_SECRET_KEY override: tests/e2e/helpers.ts supplies a valid
      # BN254 field element. This used to pass the Anvil secp256k1 test key,
      # which exceeds the BN254 modulus and cannot be an Aztec secret at all.
      - run: npm run test:e2e
        env:
          AZTEC_NODE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color --timestamps anvil aztec-sandbox
      # The crash smoke on a fresh chain: the suite above drives the sandbox
      # clock thousands of seconds ahead of wall time, and its bridges must
      # pass hard readiness (finalized tip at most 300 s in the future).
      - run: docker compose down && docker compose up -d --wait anvil aztec-sandbox
      - run: npm run test:e2e:crash
        env:
          AZTEC_NODE_URL: http://localhost:8080
      - if: failure()
        run: docker compose logs --no-color --timestamps anvil aztec-sandbox

  docker:
    # e2e too, not just [check, contract]. With the same dependencies as the
    # e2e job the two ran in parallel, so a v* tag published to ghcr regardless
    # of whether the on-chain behaviour passed. Contract class ID drift was
    # gated and nothing the e2e job proves was.
    needs: [check, contract, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The image COPYs this in; it is no longer committed to git.
      - name: Fetch contract artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-artifact
          path: contracts/spending_limit_account/target
      - name: Require the contract artifact in the build context
        run: test -s contracts/spending_limit_account/target/spending_limit_account_contract-SpendingLimitAccount.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/xochi-fi/pxe-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          # The workspace, not the action's default Git context: the downloaded
          # artifact is untracked, so a Git context silently built v0.2.0 without
          # it and every spending-limit start failed with ERR_MODULE_NOT_FOUND.
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify the published image carries the contract artifact
        run: >-
          docker run --rm --entrypoint test
          "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          -s /app/contracts/spending_limit_account/target/spending_limit_account_contract-SpendingLimitAccount.json
